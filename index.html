document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

width:6px;height:6px;border-radius:50%;background:#FF7A1A\"><\u002Fspan>Produção de Reels para negócio local · Tubarão/SC\n          <\u002Fspan>\n          <h1 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2.15rem,4.6vw,3.9rem);line-height:.98;letter-spacing:-.028em;text-wrap:balance\">\n            Você grava, posta, <span style=\"color:#FF7A1A\">e nada acontece.<\u002Fspan>\n          <\u002Fh1>\n          <p style=\"font-size:clamp(15.5px,1.25vw,18px);line-height:1.6;color:#B9BDAF;max-width:56ch\">\n            Ele sai sem gancho nos primeiros segundos, sem enquadramento pensado, sem ritmo, e fica igual ao de qualquer concorrente. Em duas horas some no feed. A ORAH entra com a direção: define o enquadramento, o gancho e o corte, grava e te entrega o Reel editado, pronto pra postar.\n          <\u002Fp>\n          <p style=\"font-size:14px;line-height:1.6;color:#9A9E90;max-width:52ch\">\n            Você não precisa saber de câmera, enquadramento ou edição. E, se preferir, nem aparece no vídeo.\n          <\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n          \n          <a href=\"{{ formLink }}\" style=\"border: 1px solid rgba(255,122,26,.45); color: #FF7A1A; font-weight: 600; font-size: 25px; padding: 17px 26px; border-radius: 11px; transition: background .18s ease,transform .18s ease; width: 417px; height: 76px; text-align: center\" style-hover=\"background:rgba(255,122,26,.12);transform:translateY(-2px);color:#FF7A1A\">Preencha o formulário<\u002Fa>\n          <a href=\"#reels\" style=\"color:#B9BDAF;font-size:15px;padding:18px 4px;border-bottom:1px solid rgba(255,255,255,.18);transition:color .18s ease,border-color .18s ease\" style-hover=\"color:#F4F5EF;border-color:#FF7A1A\">Ver os Reels que já fizemos<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hero-media\" style=\"flex:1 1 260px;max-width:400px;min-width:0;position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.07);background:#12140F;min-height:420px;animation:orahRise .6s .08s ease both\">\n        <image-slot id=\"orah-hero\" shape=\"rect\" placeholder=\"Frame vertical (9:16) de um Reel da ORAH: dono do negócio no ambiente dele, luz baixa, foco curto\"><\u002Fimage-slot>\n        <div style=\"position:absolute;left:14px;top:14px;pointer-events:none;font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:#FF7A1A;background:rgba(10,11,8,.62);padding:6px 9px;border-radius:6px\">REC · 9:16<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;margin-top:clamp(20px,3vw,34px);display:flex;flex-wrap:wrap;gap:clamp(14px,2vw,22px)\">\n      \n      \n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);background:#0C0D09\">\n    \n  <\u002Fsection>\n\n  <section id=\"problema\" style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,8vw,120px) 24px\">\n    <span style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9A9E90\">\n      <span style=\"width:6px;height:6px;border-radius:50%;background:#FF7A1A\"><\u002Fspan>O problema\n    <\u002Fspan>\n    <h2 style=\"margin:20px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.9rem,3.6vw,3rem);line-height:1.02;letter-spacing:-.026em;max-width:22ch\">\n      O problema não é falta de conteúdo. É conteúdo sem direção.\n    <\u002Fh2>\n    <p style=\"margin-top:22px;font-size:clamp(15.5px,1.2vw,17.5px);line-height:1.68;color:#B9BDAF;max-width:66ch\">\n      Vídeo gravado sem enquadramento pensado e sem gancho nos dois primeiros segundos fica parecido com o de qualquer concorrente seu, mesmo quando o seu produto é melhor. Ele não para ninguém, não vende e some. Isso custa caro, mesmo que você nunca veja a conta.\n    <\u002Fp>\n    <div style=\"margin-top:clamp(34px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden\">\n      <div style=\"background:#12140F;padding:clamp(24px,2.4vw,32px);display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:11px;color:#FF7A1A;letter-spacing:.1em\">01<\u002Fspan>\n        <p style=\"font-size:15.5px;line-height:1.62;color:#DDE2CE\">O cliente rola o feed rápido e só para no que parece feito por quem entende do assunto. Vídeo sem gancho nos primeiros segundos ele nem registra.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#12140F;padding:clamp(24px,2.4vw,32px);display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:11px;color:#FF7A1A;letter-spacing:.1em\">02<\u002Fspan>\n        <p style=\"font-size:15.5px;line-height:1.62;color:#DDE2CE\">O concorrente que posta toda semana, mesmo com vídeo mediano, fica na cabeça do seu cliente. Quem some por um mês, não.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#12140F;padding:clamp(24px,2.4vw,32px);display:flex;flex-direction:column;gap:14px\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:11px;color:#FF7A1A;letter-spacing:.1em\">03<\u002Fspan>\n        <p style=\"font-size:15.5px;line-height:1.62;color:#DDE2CE\">O tempo que você gasta tentando resolver isso sozinho sai do balcão, da cadeira do consultório, do atendimento. E ainda sobra um vídeo que parece amador.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-top:clamp(28px,3vw,40px);font-size:clamp(16px,1.3vw,19px);line-height:1.6;color:#F4F5EF;max-width:70ch;padding-left:20px;border-left:2px solid #FF7A1A\">\n      Foi por isso que a ORAH tirou a parte que exige tempo e técnica (câmera, enquadramento, direção e edição) de dentro do seu dia. Você continua sendo o dono e quem entende do assunto. A câmera é com a gente.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"direcao\" style=\"background:#0C0D09;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,8vw,120px) 24px;display:flex;flex-wrap:wrap;gap:clamp(30px,5vw,72px)\">\n      <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:22px\">\n        <span style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9A9E90\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:#FF7A1A\"><\u002Fspan>O método\n        <\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.03;letter-spacing:-.026em\">\n          Direção é o que separa um Reel de um vídeo qualquer.\n        <\u002Fh2>\n        <p style=\"font-size:clamp(15.5px,1.2vw,17.5px);line-height:1.68;color:#B9BDAF;max-width:56ch\">\n          Qualquer celular grava um vídeo hoje. O que quase ninguém tem é alguém decidindo o que filmar, como enquadrar, o que dizer nos primeiros segundos, e mantendo isso toda semana.\n        <\u002Fp>\n        <p style=\"font-size:clamp(15.5px,1.2vw,17.5px);line-height:1.68;color:#B9BDAF;max-width:56ch\">\n          A ideia e a base vêm de você, que é quem entende do seu negócio. A partir daí, dois caminhos: você já tem um roteiro ou uma ideia e a gente lapida pra funcionar melhor na câmera, ou a ORAH pesquisa e escreve o roteiro do zero.\n        <\u002Fp>\n        <a href=\"#reels\" style=\"align-self:flex-start;border:1px solid rgba(255,122,26,.45);color:#FF7A1A;font-weight:600;font-size:15px;padding:15px 24px;border-radius:11px;transition:background .18s ease,transform .18s ease\" style-hover=\"background:rgba(255,122,26,.12);transform:translateY(-2px);color:#FF7A1A\">Ver os Reels no ar →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow:hidden;align-self:flex-start\">\n        <div style=\"background:#12140F;padding:26px clamp(22px,2vw,30px);display:flex;gap:18px;align-items:flex-start\">\n          <span style=\"font-family:'Martian Mono',monospace;font-size:11px;color:#FF7A1A;padding-top:3px\">01<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em\">Enquadramento<\u002Fh3>\n            <p style=\"font-size:14.5px;line-height:1.6;color:#9A9E90\">Alguém decide de onde a câmera olha o seu produto, o seu ambiente, você.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#12140F;padding:26px clamp(22px,2vw,30px);display:flex;gap:18px;align-items:flex-start\">\n          <span style=\"font-family:'Martian Mono',monospace;font-size:11px;color:#FF7A1A;padding-top:3px\">02<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em\">Gancho<\u002Fh3>\n            <p style=\"font-size:14.5px;line-height:1.6;color:#9A9E90\">Os dois primeiros segundos que decidem se o cliente para ou continua rolando.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#12140F;padding:26px clamp(22px,2vw,30px);display:flex;gap:18px;align-items:flex-start\">\n          <span style=\"font-family:'Martian Mono',monospace;font-size:11px;color:#FF7A1A;padding-top:3px\">03<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em\">Corte<\u002Fh3>\n            <p style=\"font-size:14.5px;line-height:1.6;color:#9A9E90\">O ritmo que não deixa o vídeo morrer no meio e perder quem já estava assistindo.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#12140F;padding:26px clamp(22px,2vw,30px);display:flex;gap:18px;align-items:flex-start\">\n          <span style=\"font-family:'Martian Mono',monospace;font-size:11px;color:#FF7A1A;padding-top:3px\">04<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.015em\">Roteiro<\u002Fh3>\n            <p style=\"font-size:14.5px;line-height:1.6;color:#9A9E90\">Seu, lapidado pra câmera, ou escrito pela ORAH do zero. Os dois começam do que você conhece do negócio.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"reels\" style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,8vw,120px) 24px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between\">\n      <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:18px\">\n        <span style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9A9E90\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:#FF7A1A\"><\u002Fspan>Prova por demonstração\n        <\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.03;letter-spacing:-.026em;max-width:24ch\">\n          A ge id-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(16px,2vw,24px)\">\n        <article style=\"background:#12140F;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:clamp(26px,2.6vw,34px);display:flex;flex-direction:column;gap:20px;transition:border-color .2s ease,transform .2s ease\" style-hover=\"border-color:rgba(255,122,26,.42);transform:translateY(-3px)\">\n          <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.18;letter-spacing:-.02em\">Você não precisa aparecer se não quiser.<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A9E90\">Como funciona<\u002Fspan>\n            <p style=\"font-size:14.8px;line-height:1.62;color:#B9BDAF\">Boa parte dos vídeos foca no produto, no ambiente, no processo, no bastidor do negócio, sem depender de ninguém na frente da câmera.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"font-size:14.8px;line-height:1.62;color:#DDE2CE;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)\">Se vergonha de câmera é o que te trava até hoje, isso deixa de ser motivo pra não ter presença profissional no Instagram.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"background:#12140F;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:clamp(26px,2.6vw,34px);display:flex;flex-direction:column;gap:20px;transition:border-color .2s ease,transform .2s ease\" style-hover=\"border-color:rgba(255,122,26,.42);transform:translateY(-3px)\">\n          <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.18;letter-spacing:-.02em\">Cada vídeo é dirigido pro seu negócio.<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A9E90\">Como funciona<\u002Fspan>\n            <p style=\"font-size:14.8px;line-height:1.62;color:#B9BDAF\">Antes de gravar, a gente entende o que faz o seu negócio diferente do concorrente do lado. A direção e o roteiro partem disso.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"font-size:14.8px;line-height:1.62;color:#DDE2CE;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)\">O resultado tem a cara do seu negócio. Não sai igual ao vídeo padrão que a agência do concorrente entrega pra todo mundo.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"background:#12140F;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:clamp(26px,2.6vw,34px);display:flex;flex-direction:column;gap:20px;transition:border-color .2s ease,transform .2s ease\" style-hover=\"border-color:rgba(255,122,26,.42);transform:translateY(-3px)\">\n          <h3 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.18;letter-spacing:-.02em\">A gravação cabe na sua rotina, não o contrário.<\u002Fh3>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A9E90\">Como funciona<\u002Fspan>\n            <p style=\"font-size:14.8px;line-height:1.62;color:#B9BDAF\">A captação é feita num bloco só de tempo, sem virar o funcionamento do seu dia de cabeça pra baixo nem tomar o dia inteiro de atendimento.<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"font-size:14.8px;line-height:1.62;color:#DDE2CE;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)\">Você fecha um mês de conteúdo sem fechar as portas pra gravar.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"como\" style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,8vw,120px) 24px;display:flex;flex-wrap:wrap;gap:clamp(30px,5vw,72px)\">\n    <div class=\"como-aside\" style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px;align-self:flex-start;position:sticky;top:104px\">\n      <span style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9A9E90\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:#FF7A1A\"><\u002Fspan>Como funciona\n      <\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.9rem,3.2vw,2.7rem);line-height:1.04;letter-spacing:-.026em;max-width:20ch\">\n        O que acontece quando você chama no WhatsApp\n      <\u002Fh2>\n      <p style=\"font-size:15.5px;line-height:1.65;color:#9A9E90;max-width:40ch\">Sem contrato empurrado, sem letra miúda. Se não fizer sentido, você não gastou nada além de alguns minutos de conversa.<\u002Fp>\n      <a href=\"https://wa.link/46dk6q\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;background:#FF7A1A;color:#10130B;font-weight:600;font-size:15.5px;padding:16px 26px;border-radius:11px;transition:transform .18s ease,background .18s ease\" style-hover=\"background:#FF9445;transform:translateY(-2px);color:#10130B\">Falar no WhatsApp agora →<\u002Fa>\n    <\u002Fdiv>\n    <ol style=\"flex:1 1 420px;min-width:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n      <li style=\"display:flex;gap:clamp(18px,2.2vw,32px);padding:clamp(24px,2.6vw,34px) 0;border-top:1px solid rgba(255,255,255,.08)\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:12px;color:#FF7A1A;padding-top:5px;flex:0 0 auto\">01<\u002Fspan>\n        <p style=\"font-size:clamp(16px,1.3vw,18.5px);line-height:1.6;color:#DDE2CE\">Você conta rápido sobre o seu negócio e o que já tentou de conteúdo até agora.<\u002Fp>\n      <\u002Fli>\n      <li style=\"display:flex;gap:clamp(18px,2.2vw,32px);padding:clamp(24px,2.6vw,34px) 0;border-top:1px solid rgba(255,255,255,.08)\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:12px;color:#FF7A1A;padding-top:5px;flex:0 0 auto\">02<\u002Fspan>\n        <p style=\"font-size:clamp(16px,1.3vw,18.5px);line-height:1.6;color:#DDE2CE\">A gente te mostra os Reels que já fez pra negócios do seu tipo, ou parecido.<\u002Fp>\n      <\u002Fli>\n      <li style=\"display:flex;gap:clamp(18px,2.2vw,32px);padding:clamp(24px,2.6vw,34px) 0;border-top:1px solid rgba(255,255,255,.08)\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:12px;color:#FF7A1A;padding-top:5px;flex:0 0 auto\">03<\u002Fspan>\n        <p style=\"font-size:clamp(16px,1.3vw,18.5px);line-height:1.6;color:#DDE2CE\">Se fizer sentido pros dois lados, você recebe uma proposta com o plano certo pro seu caso: a gente lapidando o seu roteiro ou escrevendo do zero. Sem modelo genérico e sem compromisso de fechar ali.<\u002Fp>\n      <\u002Fli>\n      <li style=\"display:flex;gap:clamp(18px,2.2vw,32px);padding:clamp(24px,2.6vw,34px) 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:12px;color:#FF7A1A;padding-top:5px;flex:0 0 auto\">04<\u002Fspan>\n        <p style=\"font-size:clamp(16px,1.3vw,18.5px);line-height:1.6;color:#DDE2CE\">Fechando, a gente marca a captação num bloco de tempo só e você recebe os Reels prontos pra postar.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <section style=\"padding:0 24px clamp(20px,3vw,40px)\">\n    <div style=\"max-width:1240px;margin:0 auto;background:#FF7A1A;border-radius:22px;padding:clamp(36px,5.5vw,84px);display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,64px);color:#10130B\">\n      <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:22px\">\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(2rem,3.8vw,3.2rem);line-height:1;letter-spacing:-.03em;color:#10130B\">\n          Enquanto você decide, seu concorrente provavelmente já gravou o vídeo desse mês.\n        <\u002Fh2>\n        <a href=\"https://wa.link/46dk6q\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;background:#10130B;color:#F4F5EF;font-weight:600;font-size:clamp(15.5px,1.3vw,18px);padding:20px 30px;border-radius:12px;display:inline-flex;align-items:center;gap:10px;transition:transform .18s ease,background .18s ease\" style-hover=\"background:#1F2416;transform:translateY(-2px);color:#F4F5EF\">Falar no WhatsApp agora <span style=\"font-family:'Martian Mono',monospace;font-size:13px\">→<\u002Fspan><\u002Fa>\n        <p style=\"font-size:13.5px;line-height:1.6;color:rgba(16,19,11,.68)\">Conversa sem compromisso. A proposta sai depois que a gente entende o seu negócio, não antes.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px;font-size:clamp(15px,1.2vw,17px);line-height:1.62;color:rgba(16,19,11,.78);max-width:52ch\">\n        <p>Todo negócio local que você admira no Instagram, o que sempre tem conteúdo novo, o que aparece primeiro quando alguém pesquisa o nicho, não chegou lá com sorte.<\u002Fp>\n        <p>Chegou lá porque alguém dirigiu aquele conteúdo, toda semana, enquanto o concorrente ainda estava decidindo se valia a pena gravar.<\u002Fp>\n        <p style=\"color:#10130B;font-weight:600\">Você pode continuar tentando sozinho, entre um cliente e outro. Ou colocar a câmera, a direção e a edição na mão de quem já faz isso pra negócios como o seu.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"max-width:1240px;margin:0 auto;padding:clamp(64px,8vw,110px) 24px;display:flex;flex-wrap:wrap;gap:clamp(30px,5vw,72px)\">\n    <div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:16px;align-self:flex-start\">\n      <span style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9A9E90\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:#FF7A1A\"><\u002Fspan>Dúvidas\n      <\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.8rem,3vw,2.5rem);line-height:1.05;letter-spacing:-.026em;max-width:16ch\">\n        O que os donos perguntam antes de chamar\n      <\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 460px;min-width:0;display:flex;flex-direction:column\">\n      <details style=\"border-top:1px solid rgba(255,255,255,.09)\">\n        <summary style=\"display:flex;gap:20px;align-items:baseline;justify-content:space-between;cursor:pointer;list-style:none;padding:clamp(20px,2.2vw,28px) 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(16.5px,1.4vw,20px);letter-spacing:-.015em;color:#F4F5EF\">\n          Nunca gravei nada, nem sei o que falar na câmera.\n          <span style=\"font-family:'Martian Mono',monospace;font-size:15px;color:#FF7A1A;flex:0 0 auto\">+<\u002Fspan>\n        <\u002Fsummary>\n        <p style=\"font-size:15.5px;line-height:1.66;color:#B9BDAF;padding:0 0 clamp(22px,2.2vw,28px);max-width:62ch\">A base parte do que você conhece do seu negócio. A gente transforma isso em roteiro: lapidando o que você já tem ou escrevendo do zero, conforme o plano. Na gravação, a direção te conduz cena por cena, você não precisa decorar nada.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top:1px solid rgba(255,255,255,.09)\">\n        <summary style=\"display:flex;gap:20px;align-items:baseline;justify-content:space-between;cursor:pointer;list-style:none;padding:clamp(20px,2.2vw,28px) 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(16.5px,1.4vw,20px);letter-spacing:-.015em;color:#F4F5EF\">\n          Eu já tenho as ideias dos vídeos, só não sei gravar.\n          <span style=\"font-family:'Martian Mono',monospace;font-size:15px;color:#FF7A1A;flex:0 0 auto\">+<\u002Fspan>\n        <\u002Fsummary>\n        <p style=\"font-size:15.5px;line-height:1.66;color:#B9BDAF;padding:0 0 clamp(22px,2.2vw,28px);max-width:62ch\">Esse é o plano mais enxuto. Você traz a ideia ou o roteiro, a gente lapida pra funcionar melhor na câmera, dirige a gravação e edita. Se quiser que a ORAH assuma o roteiro do zero, com pesquisa, tem o plano mais completo.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top:1px solid rgba(255,255,255,.09)\">\n        <summary style=\"display:flex;gap:20px;align-items:baseline;justify-content:space-between;cursor:pointer;list-style:none;padding:clamp(20px,2.2vw,28px) 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(16.5px,1.4vw,20px);letter-spacing:-.015em;color:#F4F5EF\">\n          Não tenho tempo pra ficar gravando o dia todo.\n          <span style=\"font-family:'Martian Mono',monospace;font-size:15px;color:#FF7A1A;flex:0 0 auto\">+<\u002Fspan>\n        <\u002Fsummary>\n        <p style=\"font-size:15.5px;line-height:1.66;color:#B9BDAF;padding:0 0 clamp(22px,2.2vw,28px);max-width:62ch\">A captação é feita num bloco de tempo só, marcado com antecedência. Não toma o seu dia inteiro nem para o atendimento.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top:1px solid rgba(255,255,255,.09)\">\n        <summary style=\"display:flex;gap:20px;align-items:baseline;justify-content:space-between;cursor:pointer;list-style:none;padding:clamp(20px,2.2vw,28px) 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(16.5px,1.4vw,20px);letter-spacing:-.015em;color:#F4F5EF\">\n          Tenho vergonha de aparecer em vídeo.\n          <span style=\"font-family:'Martian Mono',monospace;font-size:15px;color:#FF7A1A;flex:0 0 auto\">+<\u002Fspan>\n        <\u002Fsummary>\n        <p style=\"font-size:15.5px;line-height:1.66;color:#B9BDAF;padding:0 0 clamp(22px,2.2vw,28px);max-width:62ch\">Dá pra gravar sem você aparecer, com foco no produto, no ambiente ou no processo. Muitos dos vídeos que a gente faz funcionam assim.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top:1px solid rgba(255,255,255,.09)\">\n        <summary style=\"display:flex;gap:20px;align-items:baseline;justify-content:space-between;cursor:pointer;list-style:none;padding:clamp(20px,2.2vw,28px) 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(16.5px,1.4vw,20px);letter-spacing:-.015em;color:#F4F5EF\">\n          Já contratei um freelancer antes e o vídeo não deu resultado nenhum.\n          <span style=\"font-family:'Martian Mono',monospace;font-size:15px;color:#FF7A1A;flex:0 0 auto\">+<\u002Fspan>\n        <\u002Fsummary>\n        <p style=\"font-size:15.5px;line-height:1.66;color:#B9BDAF;padding:0 0 clamp(22px,2.2vw,28px);max-width:62ch\">Quase sempre a direção é o que faltou: o vídeo foi gravado sem enquadramento pensado, sem gancho, sem pensar em quem ia assistir. A câmera e o freelancer não eram o problema principal. É essa parte que a ORAH faz diferente.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09)\">\n        <summary style=\"display:flex;gap:20px;align-items:baseline;justify-content:space-between;cursor:pointer;list-style:none;padding:clamp(20px,2.2vw,28px) 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(16.5px,1.4vw,20px);letter-spacing:-.015em;color:#F4F5EF\">\n          Quanto custa?\n          <span style=\"font-family:'Martian Mono',monospace;font-size:15px;color:#FF7A1A;flex:0 0 auto\">+<\u002Fspan>\n        <\u002Fsummary>\n        <p style=\"font-size:15.5px;line-height:1.66;color:#B9BDAF;padding:0 0 clamp(22px,2.2vw,28px);max-width:62ch\">Depende do volume de conteúdo e do plano: a gente lapidando o seu roteiro sai mais enxuto, a ORAH escrevendo do zero agrega pesquisa e custa mais. O valor é fechado depois de entender o seu caso. Chama no WhatsApp e a gente te passa direto por lá.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid rgba(255,255,255,.08);background:#0C0D09\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(44px,5vw,72px) 24px clamp(28px,3vw,40px);display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,56px)\">\n      <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:9px\">\n          <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(28px,3.4vw,42px);letter-spacing:-.03em;line-height:1\">ORAH<\u002Fspan>\n          <span style=\"width:8px;height:8px;border-radius:50%;background:#FF7A1A;display:block;margin-bottom:6px\"><\u002Fspan>\n          <span style=\"font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.22em;color:#9A9E90;text-transform:uppercase\">Digital<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:14.5px;line-height:1.6;color:#9A9E90;max-width:34ch\">Direção, captação e edição de Reels para negócio local. Tubarão, Santa Catarina.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:'Martian Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#5F6357\">Página<\u002Fspan>\n        <a href=\"#problema\" style=\"font-size:14.5px;color:#B9BDAF\" style-hover=\"color:#F4F5EF\">O problema<\u002Fa>\n        <a href=\"#direcao\" style=\"font-size:14.5px;color:#B9BDAF\" style-hover=\"color:#F4F5EF\">O método<\u002Fa>\n        <a href=\"#reels\" style=\"font-size:14.5px;color:#B9BDAF\" style-h height:52px\">Falar no WhatsApp agora <span style=\"font-family:'Martian Mono',monospace;font-size:13px\">→<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://wa.link/46dk6q&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;formUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;instagramHandle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;orahdigital&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;showTestimonial&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Conteúdo&quot;}}\">\nclass Component extends DCLogic {\n  rail = React.createRef();\n  scrollRail(dir) {\n    const el = this.rail.current;\n    if (!el) return;\n    const card = el.firstElementChild;\n    const gap = 16;\n    const step = card ? (card.getBoundingClientRect().width + gap) * (window.innerWidth <= 620 ? 1 : 3) : el.clientWidth;\n    el.scrollBy({ left: dir * step, behavior: \"smooth\" });\n  }\n  renderVals() {\n    const wa = (this.props.whatsappNumber ?? \"https://wa.link/46dk6q\").trim();\n    let waLink = \"#faq\";\n    if (wa) {\n      if (/^https?:\\/\\//i.test(wa)) waLink = wa;\n      else if (/^(wa\\.link|wa\\.me)\\//i.test(wa)) waLink = \"https://\" + wa;\n      else {\n        const digits = wa.replace(/\\D/g, \"\");\n        if (digits) waLink = \"https://wa.me/\" + digits;\n      }\n    }\n    const handle = (this.props.instagramHandle ?? \"orahdigital\").replace(/^@/, \"\");\n    return {\n      railRef: this.rail,\n      railPrev: () => this.scrollRail(-1),\n      railNext: () => this.scrollRail(1),\n      waLink: waLink,\n      igLink: \"https://instagram.com/\" + handle,\n      formLink: (this.props.formUrl ?? \"\").trim() || \"formulario.html\",\n      showTestimonial: this.props.showTestimonial ?? false\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
